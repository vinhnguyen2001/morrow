# XcodeGen spec (dev-only tool, not an app dependency).
# On a Mac: brew install xcodegen && cd source && xcodegen generate
name: Morrow
options:
  bundleIdPrefix: com.morrow
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Morrow:
    type: application
    platform: iOS
    sources:
      - App
      - DesignSystem
      - Domain
      - Features
      - Persistence
    scheme:
      testTargets:
        - MorrowTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morrow.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  MorrowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MorrowTests
    dependencies:
      - target: Morrow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morrow.app.tests
        GENERATE_INFOPLIST_FILE: YES
